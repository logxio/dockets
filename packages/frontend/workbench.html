<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Meridian · Workbench</title>
    <script>
      (function () {
        function normalizeTheme(v) {
          var s = String(v || "").trim().toLowerCase();
          if (s === "dark" || s === "night") return "dark";
          if (s === "light" || s === "day") return "light";
          return "";
        }

        function safeParentTheme() {
          try {
            if (window.parent && window.parent !== window) {
              return normalizeTheme(window.parent.document.documentElement.dataset.theme);
            }
          } catch {}
          return "";
        }

        function prefersDark() {
          try {
            return typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {}
          return false;
        }

        var sp = new URLSearchParams(location.search);
        var theme = (function () {
          var q = normalizeTheme(sp.get("theme"));
          if (q) return q;
          var inherited = safeParentTheme();
          if (inherited) return inherited;
          try {
            var saved = normalizeTheme(window.localStorage.getItem("cldemo_theme"));
            if (saved) return saved;
          } catch {}
          // Product default: light (avoid dark UA form controls on some browsers)
          return "light";
        })();
        document.documentElement.dataset.theme = theme;

        var lang = (function () {
          var q = String(sp.get("lang") || "").trim().toLowerCase();
          if (q === "en" || q === "zh") return q;
          try {
            var saved = String(window.localStorage.getItem("cldemo_lang") || "").trim().toLowerCase();
            if (saved === "en" || saved === "zh") return saved;
          } catch {}
          return "zh";
        })();
        document.documentElement.lang = lang === "en" ? "en" : "zh-CN";

        window.addEventListener("message", function (evt) {
          try {
            if (evt.origin !== location.origin) return;
            var data = evt.data;
            if (!data || typeof data !== "object") return;
            if (data.type === "cldemo:theme") {
              var next = normalizeTheme(data.theme);
              if (next) document.documentElement.dataset.theme = next;
            }
            if (data.type === "cldemo:lang") {
              var nextLang = String(data.lang || "").trim().toLowerCase();
              if (nextLang === "zh" || nextLang === "en") {
                document.documentElement.lang = nextLang === "en" ? "en" : "zh-CN";
                // Dispatch custom event for React to pick up
                window.dispatchEvent(new CustomEvent("cldemo:langchange", { detail: { lang: nextLang } }));
              }
            }
          } catch {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
