[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahpi"
version = "2.0.0"
description = "AHPI (Asymmetric Heterogeneous Pairwise Interactions) - A generalized Bradley-Terry model for ranking from pairwise comparisons"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Alexandre Mojon", email = "alexandre.mojon@unisg.ch"},
    {name = "Robert Mahari", email = "rmahari@mit.edu"},
]
maintainers = [
    {name = "Legal Intelligence Platform Team"},
]
keywords = [
    "ranking",
    "bradley-terry",
    "pairwise-comparison",
    "expectation-maximization",
    "legal-analytics",
    "computational-law",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/legal-intelligence-platform"
Documentation = "https://github.com/your-org/legal-intelligence-platform#readme"
Repository = "https://github.com/your-org/legal-intelligence-platform"
Issues = "https://github.com/your-org/legal-intelligence-platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["ahpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
