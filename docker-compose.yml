services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
