[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-intelligence-api"
version = "1.0.0"
description = "FastAPI backend for Legal Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Yan Su", email = "hi@yansu.me"},
]
keywords = [
    "fastapi",
    "legal-analytics",
    "api",
    "ahpi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "ahpi>=2.0.0",
    "legal-pipeline>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[project.scripts]
legal-api = "app.main:run"

[project.urls]
Homepage = "https://github.com/logxio/dockets"
Documentation = "https://github.com/logxio/dockets/tree/main/api"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
