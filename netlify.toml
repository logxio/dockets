[build]
  base = "packages/frontend"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/workbench"
  to = "/workbench.html"
  status = 200

[[redirects]]
  from = "/workbench/*"
  to = "/workbench.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
