[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://computational-law-demo.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/workbench"
  to = "/workbench.html"
  status = 200

[[redirects]]
  from = "/workbench/*"
  to = "/workbench.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
